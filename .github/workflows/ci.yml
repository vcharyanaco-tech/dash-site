name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Server tests + syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/server/package-lock.json

      - name: Install server deps
        working-directory: src/server
        run: npm ci

      - name: Secret scan
        run: node scripts/secret-scan.cjs

      - name: Dependency audit
        working-directory: src/server
        run: npm audit --audit-level=high

      - name: Validate DB migrations (fresh + idempotent re-boot)
        run: node scripts/check-db-migrations.cjs

      - name: Server test suite
        working-directory: src/server
        run: npm test

      - name: Syntax check app.js
        run: node --check app.js

      - name: Syntax check frontend modules
        run: |
          for f in src/app/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
        shell: bash

      - name: Verify app.js round-trip from modules
        run: |
          cp app.js /tmp/app-carried.js
          node build/build-app.js
          diff -q app.js /tmp/app-carried.js && echo "ROUND-TRIP OK" || { echo "app.js drifted from src/app modules — run node build/build-app.js and commit the result"; exit 1; }
        shell: bash

      - name: Syntax check worker
        run: node --check src/worker/worker.js

      - name: Frontend bundle size budget
        run: node scripts/check-bundle-size.cjs

      - name: Syntax check server sources
        run: |
          for f in app.js src/worker/worker.js src/server/*.js src/server/tests/*.js scripts/*.cjs; do
            [ -f "$f" ] && node --check "$f"
          done
        shell: bash
