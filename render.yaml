# Render Blueprint — India Post Dashboard (Node/SQLite)
#
# Deploy: push to GitHub (vcharyanaco-tech/dash-site) and use
#   New + > Blueprint  (or: connect the repo and Render picks up render.yaml)
#
# Free-tier constraints are worked around via the Cloudflare Worker
# (dashv1-proxy, already fronting dashboardharyana.site):
#   - Ephemeral filesystem  → start.js restores dashboard.db + uploads from
#     the worker's DATA_BACKUP_KV bridge on boot (src/server/data-sync.js),
#     and pushes a fresh snapshot every 10 min + on SIGTERM, so redeploys
#     lose at most a few minutes of deltas instead of everything.
#   - SMTP ports blocked    → MAIL_TRANSPORT=http posts messages over HTTPS
#     to the worker's /api/send-email relay, which speaks SMTP to Gmail via
#     the TCP connect() API (Worker secrets SMTP_USER/SMTP_PASS).
#   - 15-min spin-down      → the worker's "*/10 * * * *" cron pings
#     /api/health so the instance never idles out.
services:
  - type: web
    name: dash-site
    runtime: docker
    repo: https://github.com/vcharyanaco-tech/dash-site
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DASH_DATA_DIR
        value: /app/data
      - key: DASH_STATIC_ROOT
        value: /app/www
      # Persistent-disk bridge (KV-backed, via the Cloudflare Worker)
      - key: DATA_SYNC_URL
        value: https://dashboardharyana.site/api/backup
      - key: WORKER_API_TOKEN
        sync: false
      # Email via the worker SMTP relay (SMTP ports are blocked on free)
      - key: MAIL_TRANSPORT
        value: http
      - key: MAIL_HTTP_URL
        value: https://dashboardharyana.site/api/send-email
      # SMTP kept for reference/paid-plan fallback (blocked on free tier)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: vcharyanaco@gmail.com
      - key: SMTP_FROM
        value: vcharyanaco@gmail.com
      - key: SMTP_PASS
        sync: false
