name = "dashv1-proxy"
main = "worker.js"
account_id = "a01eb877733d755cb57e25827a9c52fe"
compatibility_date = "2026-08-04"

# Routes: serve the Worker at dashboardharyana.site
# Requires the domain to be active on Cloudflare (nameservers pointing to Cloudflare)
routes = [
  { pattern = "dashboardharyana.site/*", zone_name = "dashboardharyana.site" },
  { pattern = "www.dashboardharyana.site/app*", zone_name = "dashboardharyana.site" }
]

[vars]
# SERVER_ORIGIN is set as a Cloudflare secret (wrangler secret put SERVER_ORIGIN)
# so it is NOT committed to this file. GAS_URL/GAS_SCRIPT_URL are retained for
# backward compatibility but are no longer used for routing.
GAS_URL = "https://script.google.com/macros/s/AKfycbxPwINC2LOPQ-II6vhMXuEqy30Fim32INQNjK3j0sK_9kBClr2MrbSPDnR91AmC7Ian/exec"
GAS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPwINC2LOPQ-II6vhMXuEqy30Fim32INQNjK3j0sK_9kBClr2MrbSPDnR91AmC7Ian/"

[[kv_namespaces]]
binding = "AI_INSIGHTS_KV"
id = "3aed6a4c7ad842c7b5fba1558a68ab06"

# Same namespace under a second binding — holds backup:... keys for the
# Node data-sync bridge (persistent-disk stand-in on Render free).
[[kv_namespaces]]
binding = "DATA_BACKUP_KV"
id = "3aed6a4c7ad842c7b5fba1558a68ab06"

# Keep-alive: Render free services spin down after 15 min of inactivity;
# this cron pings the backend /api/health every 10 min to keep it warm.
# The worker SKIPS the ping between 21:00-06:00 IST so the instance sleeps
# overnight and banks instance-hours against the 750h/month free cap.
[triggers]
crons = ["*/10 * * * *"]
